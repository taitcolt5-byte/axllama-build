name: Build llama.cpp (Android arm64-v8a)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: master

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure CMake
        run: |
          cmake -B build-android \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF

      - name: Build
        run: cmake --build build-android --config Release -j$(nproc)

      - name: Collect
        run: |
          mkdir -p out
          find build-android -name "*.so" -type f -exec cp {} out/ \;
          find build-android -type f -name "llama-server" -exec cp {} out/ \;
          rm -f out/libllama-{bench,batched-bench,cli,completion,fit-params,perplexity,quantize}-impl.so
          STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          $STRIP out/* || true
          ls -lh out/
          echo "=== llama-server NEEDED ==="
          readelf -d out/llama-server | grep -E "NEEDED|RUNPATH|RPATH" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-android-arm64
          path: out/*
